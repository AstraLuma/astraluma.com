
name: Publish on Teahouse

on:
  push:
  workflow_dispatch:
  repository_dispatch:

permissions:
  id-token: write # This is required for requesting the JWT
  contents: read  # This is required for actions/checkout

concurrency:
  group: "teahouse"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/python:3.6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - run: pip install pipenv
      - run: pipenv install
      - run: pipenv run make publish
      - uses: actions/upload-artifact@v4
        with:
          name: website
          path: ./public

  # Deployment job
  deploy:
    if: github.repository == 'AstraLuma/astraluma.com' && github.ref == 'refs/heads/trunk'
    environment:
      name: teahouse
      url: https://astraluma.com
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: website
          path: ./public
      - name: Upload
        uses: teahouse-hosting/upload@trunk
        with:
          domain: astraluma.com
          root: ./public
