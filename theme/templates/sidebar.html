<div class="sidebar">
	<div class="container sidebar-sticky">
		<div class="sidebar-about">

			<h1>
				<a href="/">
					{% if PROFILE_IMAGE %}
					<img class="profile-picture" src="{{ SITEURL }}/images/{{ PROFILE_IMAGE }}">
					{% endif %}
					{{ SITENAME }}
				</a>
			</h1>
			<p class="lead"></p>
			<p class="lead">{{ BIO }} </p>
			<p></p>
		</div>
		<nav class="sidebar-nav">
			{% for name, link in SOCIAL %}
				{% if name == 'email' %}
					<a class="sidebar-nav-item" href="mailto:{{ link }}">
						<i class="fa fa-envelope"></i>
					</a>
				{% elif name == 'kofi' %}
					<a title="Support me on ko-fi.com" class="sidebar-nav-item" href="{{ link }}" target="_blank">
						<img src="https://ko-fi.com/img/cuplogo.svg">
					</a>
				{% elif name == 'feed' %}
					<a class="sidebar-nav-item" href="{{ FEED_ALL_RSS }}">
						<i class="fa fa-feed"></i>
					</a>
				{% else %}
					<a class="sidebar-nav-item" href="{{ link }}">
						<i class="fab fa-{{ name }}"></i>
					</a>
				{% endif %}
			{% endfor %}
		</nav>
	</div>
</div>
